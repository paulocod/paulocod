name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # Card rendering runs with a read-only token: the third-party action never
  # gets credentials that could write to the repo. The SVGs are handed to the
  # commit job as an artifact.
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          # Without this the action defaults to core_version "v2" and npm-installs
          # the floating latest 2.x at run time, so pinning the action by SHA would
          # not pin the code that actually renders the card and reads the token.
          core_version: 2.1.5

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&size_weight=0.3&count_weight=0.7&theme=dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          # Without this the action defaults to core_version "v2" and npm-installs
          # the floating latest 2.x at run time, so pinning the action by SHA would
          # not pin the code that actually renders the card and reads the token.
          core_version: 2.1.5

      - uses: actions/upload-artifact@v7
        with:
          name: cards
          path: profile/*.svg
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cards
          path: profile

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push

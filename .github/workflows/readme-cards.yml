name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # `token` uses GRS_PAT when the secret exists, otherwise falls back to the
      # built-in GITHUB_TOKEN. GITHUB_TOKEN only sees public activity; to include
      # private contributions, add a GRS_PAT secret (classic PAT, scopes `repo`
      # and `read:user`) and the cards pick it up on the next run — no edit here.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GRS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&size_weight=0.3&count_weight=0.7&theme=dark
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
